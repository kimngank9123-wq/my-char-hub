<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HƯỚNG DƯƠNG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MÀN HÌNH CHÀO
    ========================== -->

    <section class="welcome-screen" id="welcomeScreen">

        <div class="welcome-content">

            <!-- TÊN NẰM NGOÀI KHUNG -->
            <h1 class="sunflower-title">
                HƯỚNG DƯƠNG
            </h1>


            <!-- KHUNG TRONG SUỐT -->
            <div class="welcome-box">

                <div class="decorative-line">
                    <span></span>
                    <i>✦</i>
                    <span></span>
                </div>

                <h2>Chào mừng</h2>

                <p>
                    Chào mừng bạn đến với
                    thế giới nhỏ của Hướng Dương.
                </p>

                <button
                    class="enter-button"
                    id="enterButton"
                    type="button"
                >
                    ENTER
                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         TRANG CHÍNH
    ========================== -->

    <main class="main-page" id="mainPage">

        <h2 class="main-title">
            HƯỚNG DƯƠNG
        </h2>

        <section class="characters">

            <h3>My Characters</h3>

            <div class="character-list">
                <!-- Char sẽ thêm sau -->
            </div>

        </section>

    </main>


    <script>

        const enterButton =
            document.getElementById("enterButton");

        const welcomeScreen =
            document.getElementById("welcomeScreen");

        const mainPage =
            document.getElementById("mainPage");


        enterButton.addEventListener("click", () => {

            /* Không cho bấm nhiều lần */
            enterButton.disabled = true;

            /* Bắt đầu chuyển màn */
            welcomeScreen.classList.add("leaving");

            /*
             * Đợi animation màn chào gần hoàn tất
             * rồi mới cho trang chính xuất hiện.
             * Như vậy hai màn không chồng lên nhau.
             */

            setTimeout(() => {

                mainPage.classList.add("visible");

            }, 700);


            /*
             * Sau khi màn chào biến mất hoàn toàn,
             * loại nó khỏi màn hình.
             */

            setTimeout(() => {

                welcomeScreen.classList.add("gone");

            }, 1300);

        });

    </script>

</body>
</html>
