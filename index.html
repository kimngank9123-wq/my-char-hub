<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HƯỚNG DƯƠNG — Character Archive</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MÀN HÌNH MỞ ĐẦU -->

  <section class="intro">

    <div class="intro-content">

      <div class="intro-flower">🌻</div>

      <h1>HƯỚNG DƯƠNG</h1>

      <div class="line"></div>

      <p>Character Archive</p>

    </div>

  </section>


  <!-- TRANG CHÍNH -->

  <main class="container main-content">

    <header class="hero">

      <div class="hero-flower">🌻</div>

      <h1>HƯỚNG DƯƠNG</h1>

      <div class="line"></div>

      <div class="subtitle">
        CHARACTER ARCHIVE
      </div>

      <p class="description">
        Welcome to a little world of stories,
        memories and characters.
      </p>

    </header>


    <section>

      <h2 class="section-title">
        ✦ MY CHARACTERS ✦
      </h2>


      <div class="char-card">

        <div class="sunflower">
          🌻
        </div>

        <h3 class="char-name">
          Coming Soon
        </h3>

        <p class="char-info">
          A new character is waiting to be discovered.
        </p>

        <a href="#" class="view-button">
          VIEW CHARACTER
        </a>

      </div>

    </section>


    <footer>
      ✦ HƯỚNG DƯƠNG ✦
    </footer>

  </main>

</body>
</html>
